<!-- lex/templates/admin/base_site.html 1-->
{% extends "admin/base_site.html" %}
{% load static %}

{% block branding %}
<div style="display: flex; align-items: center; gap: 15px;">
    <img src="{% static 'lex/img/logo.png' %}" alt="Logo" height="40" style="display: none;">
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}">
            ⚖️ Юридическая фирма "Lex" - Панель управления
        </a>
    </h1>
</div>
{% endblock %}

{% block extrastyle %}
<style>
    #header {
        background: #2c3e50 !important;
    }
    .module h2, .module caption {
        background: #34495e !important;
    }
    div.breadcrumbs {
        background: #34495e !important;
    }
    .button, input[type=submit], input[type=button], .submit-row input {
        background: #27ae60 !important;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: #2ecc71 !important;
    }
</style>
{% endblock %}

{% block footer %}
<div id="footer" style="text-align: center; padding: 10px; background: #f8f9fa; margin-top: 20px;">
    <p>© 2024 Юридическая фирма "Lex". Все права защищены.</p>
</div>
{% endblock %}
